<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our little world</title>
<meta name="description" content="Le pulizie di casa diventano missioni: un gioco per due.">
<meta name="theme-color" content="#5d3d25">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="pre">

<header class="hud">
  <button class="hud-hero" id="heroChip" hidden></button>
  <span class="coins" id="coinChip" hidden></span>
  <button class="icon-btn" id="btnSettings" aria-label="Impostazioni della casa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M5.5 18.5l2.1-2.1M16.4 7.6l2.1-2.1"/></svg></button>
</header>

<main id="view">
  <section class="gate"><h2>Our little world</h2><p class="muted small">Le candele si accendono…</p></section>
</main>

<button class="fab" id="fab" aria-label="Nuova faccenda" hidden>+</button>

<nav class="tabs" aria-label="Sezioni">
  <button data-view="casa" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V10l4-3V4h2v2l2-1.5L20 10v11z"/><path d="M10 21v-5a2 2 0 0 1 4 0v5"/></svg>Dimora</button>
  <button data-view="missioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h11a2 2 0 0 1 2 2v12a2 2 0 0 0 2 2H8a2 2 0 0 1-2-2z"/><path d="M6 4a2 2 0 0 0-2 2v2h2M10 9h6M10 13h6"/></svg>Missioni</button>
  <button data-view="eroe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></svg>Eroe</button>
  <button data-view="premi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10h16v4H4zM6 14v7h12v-7M12 10v11"/><path d="M12 10c-2-4-6-4-6-1.5S10 10 12 10c2 0 6 1 6-1.5S14 6 12 10z"/></svg>Premi</button>
  <button data-view="sgabuzzino"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3h8v3l2 3v11a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V9l2-3z"/><path d="M6 12h12"/></svg>Sgabuzzino</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="js/store.js"></script>
<script src="js/sprite.js"></script>
<script src="js/csv.js"></script>
<script src="js/ampolle.js"></script>
<script src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(e => console.error("sw", e)));
</script>
</body>
</html>
